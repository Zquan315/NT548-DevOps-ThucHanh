AWSTemplateFormatVersion: '2010-09-09'
Description: main stack

Resources:
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "{{vpc}}"

  NATStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "{{nat-gateway}}"
      Parameters:
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        PublicSubnetId: !GetAtt VPCStack.Outputs.PublicSubnetId

  SGStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "{{security-groups}}"
      Parameters:
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        # MyIp: 192.168.0.137/32  # your specific IP
        # MyIp: 118.68.140.83/32
        MyIp: 171.225.248.146/32

  RouteTableStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "{{route-tables}}"
      Parameters:
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        PublicSubnetId: !GetAtt VPCStack.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt VPCStack.Outputs.PrivateSubnetId
        IGWId: !GetAtt VPCStack.Outputs.IGWId
        NatGatewayId: !GetAtt NATStack.Outputs.Nhom16NatGatewayId

  EC2Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "{{ec2}}"
      Parameters:
        PublicSubnetId: !GetAtt VPCStack.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt VPCStack.Outputs.PrivateSubnetId
        PublicSG: !GetAtt SGStack.Outputs.Nhom16PublicSecurityGroup
        PrivateSG: !GetAtt SGStack.Outputs.Nhom16PrivateSecurityGroup
        KeyName: Cutelovely # your key pair
